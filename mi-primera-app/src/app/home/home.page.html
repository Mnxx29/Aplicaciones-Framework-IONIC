<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-title>Aura Flow</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="content-box">
    <div class="icon-badge">✨</div>
    <h1>¡Bienvenido a Aura Flow!</h1>
    <p class="welcome-subtitle">
      Tu espacio inteligente para potenciar tus metas.<br>
      Organiza tus tareas y conecta con tu mejor versión.
    </p>

    <div class="button-group">
      <ion-button expand="block" color="primary">
        Iniciar Sesión
      </ion-button>
      <ion-button expand="block" color="success" shape="round">
        Crear Cuenta Gratis
      </ion-button>
    </div>
  </div>
</ion-content>
