<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Galería
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Galería</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="gallery-header">
    <h1 class="gallery-title">Bienvenido a la Galería</h1>
    <p class="gallery-subtitle">Explora nuestro contenido:</p>
  </div>

  <div class="gallery-grid">
    <!-- Item 1: Inteligencia Artificial -->
    <div class="gallery-card">
      <div class="card-image-box">
        <img 
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnXI0y5rRACaew5CMXSf90ozkb6r4UeGTch2lAqGzr0h__8BxVHE_un2zw&s=10" 
          alt="Inteligencia artificial" 
        />
      </div>
      <div class="card-info">
        <h3>Inteligencia artificial</h3>
      </div>
    </div>

    <!-- Item 2: Data Science -->
    <div class="gallery-card">
      <div class="card-image-box">
        <img 
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbdPHJgBhRfEBBy4EqjEaX9HNGpt_wzLdxV8-VpJG63on8y-bDVEIxHDAD&s=10" 
          alt="Data science" 
        />
      </div>
      <div class="card-info">
        <h3>Data science</h3>
      </div>
    </div>

    <!-- Item 3: Aplicaciones Móviles -->
    <div class="gallery-card">
      <div class="card-image-box">
        <img 
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9ngBopqScJ6SJMYxOf2852R2sN_D1AiJ0C7GoWrV0zw&s=10" 
          alt="Aplicaciones móviles" 
        />
      </div>
      <div class="card-info">
        <h3>Aplicaciones móviles</h3>
      </div>
    </div>

    <!-- Item 4: Redes de Informática -->
    <div class="gallery-card">
      <div class="card-image-box">
        <img 
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLE3u2VMehV-0V1RTUtesdd7f5yNZhyPaVU31TlfHss_-0MTKo4zTsM8pX&s=10" 
          alt="Redes de informática" 
        />
      </div>
      <div class="card-info">
        <h3>Redes de informática</h3>
      </div>
    </div>
  </div>
</ion-content>
