<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Aura • Alertas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="aura-content">
  <div class="page-container">
    <p class="section-subtitle">Eventos recientes enviados a cuidadores</p>

    <div class="alerts-list">
      @for (item of alerts; track item.id) {
        <ion-card
          class="alert-card"
          [class.is-resolved]="item.resolved"
          (click)="toggleResolved(item)"
        >
          <ion-card-content>
            <div class="alert-row">
              <div class="alert-icon" [class]="item.level">
                <ion-icon [name]="item.icon"></ion-icon>
              </div>
              <div class="alert-body">
                <div class="alert-top">
                  <h3>{{ item.title }}</h3>
                  <ion-badge [color]="item.resolved ? 'success' : item.level">
                    {{ item.resolved ? 'Atendida' : 'Nueva' }}
                  </ion-badge>
                </div>
                <p class="alert-detail">{{ item.detail }}</p>
                <span class="alert-time">{{ item.time }} • Toca para cambiar estado</span>
              </div>
            </div>
          </ion-card-content>
        </ion-card>
      }
    </div>
  </div>
</ion-content>
