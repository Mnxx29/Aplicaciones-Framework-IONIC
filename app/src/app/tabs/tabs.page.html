<ion-menu contentId="aura-tabs-content" side="start">
  <ion-header class="ion-no-border">
    <ion-toolbar color="primary">
      <ion-title>Aura</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="menu-content">
    <div class="menu-profile-box">
      <div class="avatar-circle">
        <ion-icon name="heart-circle-outline"></ion-icon>
      </div>
      <div class="profile-info">
        <h3>Carlos Mendoza</h3>
        <p>Pulsera Aura • Conectada</p>
      </div>
    </div>

    <ion-list lines="none" class="menu-list">
      <ion-menu-toggle auto-hide="true">
        <ion-item button (click)="goToTab('/tabs/tab1')" detail="false" class="menu-item">
          <ion-icon name="pulse-outline" slot="start"></ion-icon>
          <ion-label>Inicio y Monitoreo</ion-label>
        </ion-item>

        <ion-item button (click)="goToTab('/tabs/tab2')" detail="false" class="menu-item">
          <ion-icon name="notifications-outline" slot="start"></ion-icon>
          <ion-label>Servicios y Alertas</ion-label>
        </ion-item>

        <ion-item button (click)="goToTab('/tabs/tab3')" detail="false" class="menu-item">
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Cuidadores y Perfil</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>

    <div class="menu-footer">
      <ion-menu-toggle auto-hide="true">
        <ion-button expand="block" fill="outline" color="danger" (click)="logout()">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          Cerrar Sesión
        </ion-button>
      </ion-menu-toggle>
    </div>
  </ion-content>
</ion-menu>

<div class="ion-page" id="aura-tabs-content">
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="tab1" href="/tabs/tab1">
        <ion-icon aria-hidden="true" name="pulse-outline"></ion-icon>
        <ion-label>Inicio</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="tab2" href="/tabs/tab2">
        <ion-icon aria-hidden="true" name="notifications-outline"></ion-icon>
        <ion-label>Servicios</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="tab3" href="/tabs/tab3">
        <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
        <ion-label>Cuidadores</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</div>
