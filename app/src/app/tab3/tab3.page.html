<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Aura • Cuidadores</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="aura-content">
  <div class="page-container">
    <!-- Ficha del Adulto Mayor -->
    <ion-card class="elder-card">
      <ion-card-content>
        <div class="elder-header">
          <ion-icon name="person-circle-outline" class="elder-avatar"></ion-icon>
          <div class="elder-info">
            <h2>Carlos Mendoza</h2>
            <p>78 años • Sangre O+ • Pulsera Aura #A-204</p>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <p class="section-label">Red de Cuidadores Vinculados</p>

    <!-- Lista de Cuidadores -->
    <div class="caregivers-list">
      @for (c of caregivers; track c.name) {
        <ion-card class="caregiver-card">
          <ion-card-content>
            <div class="caregiver-row">
              <div class="caregiver-details">
                <h3>{{ c.name }}</h3>
                <p>{{ c.role }}</p>
                <span class="phone-line">
                  <ion-icon name="call-outline"></ion-icon>
                  {{ c.phone }}
                </span>
              </div>
              <ion-badge color="success">{{ c.status }}</ion-badge>
            </div>
          </ion-card-content>
        </ion-card>
      }
    </div>

    <div class="actions-box">
      <ion-button expand="block" shape="round" (click)="notifyCaregivers()">
        <ion-icon name="paper-plane-outline" slot="start"></ion-icon>
        Enviar Alerta de Prueba
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        color="danger"
        shape="round"
        (click)="logout()"
      >
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Cerrar Sesión
      </ion-button>
    </div>
  </div>
</ion-content>
