<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Aura • Acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content">
  <div class="login-wrapper">
    <div class="login-header">
      <div class="logo-circle">
        <ion-icon name="heart-circle-outline"></ion-icon>
      </div>
      <h1 class="login-title">Aura</h1>
      <p class="login-subtitle">Monitoreo y cuidado del adulto mayor</p>
    </div>

    <ion-card class="login-card">
      <ion-card-content>
        <form (ngSubmit)="onLogin()" class="login-form">
          <div class="input-group">
            <ion-label class="custom-label">Usuario Cuidador</ion-label>
            <ion-item lines="none" class="custom-item">
              <ion-icon name="person-outline" slot="start" class="field-icon"></ion-icon>
              <ion-input
                type="text"
                placeholder="Ej. admin"
                [(ngModel)]="username"
                name="username"
                [clearInput]="true"
                autocomplete="username"
                autocapitalize="none"
                (ionInput)="errorMessage = ''"
              ></ion-input>
            </ion-item>
          </div>

          <div class="input-group">
            <ion-label class="custom-label">Contraseña</ion-label>
            <ion-item lines="none" class="custom-item">
              <ion-icon name="lock-closed-outline" slot="start" class="field-icon"></ion-icon>
              <ion-input
                [type]="showPassword ? 'text' : 'password'"
                placeholder="••••"
                [(ngModel)]="password"
                name="password"
                autocomplete="current-password"
                (ionInput)="errorMessage = ''"
              ></ion-input>
              <ion-button
                fill="clear"
                slot="end"
                class="password-toggle-btn"
                (click)="toggleShowPassword()"
                type="button"
              >
                <ion-icon
                  slot="icon-only"
                  [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
                ></ion-icon>
              </ion-button>
            </ion-item>
          </div>

          @if (errorMessage) {
            <div class="error-banner">
              <ion-icon name="alert-circle-outline"></ion-icon>
              <span>{{ errorMessage }}</span>
            </div>
          }

          <ion-button
            expand="block"
            shape="round"
            type="submit"
            class="submit-btn"
            [disabled]="isLoading"
          >
            @if (isLoading) {
              <ion-spinner name="crescent" slot="start"></ion-spinner>
              <span>Ingresando...</span>
            } @else {
              <ion-icon name="log-in-outline" slot="start"></ion-icon>
              <span>Entrar a Aura</span>
            }
          </ion-button>
        </form>

        <div class="demo-box">
          <div class="demo-credentials">
            <span>Usuario: <strong>{{ defaultUser }}</strong></span>
            <span>Clave: <strong>{{ defaultPass }}</strong></span>
          </div>
          <ion-button
            fill="clear"
            size="small"
            class="auto-fill-btn"
            (click)="fillDemoCredentials()"
            type="button"
          >
            Autocompletar acceso
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
